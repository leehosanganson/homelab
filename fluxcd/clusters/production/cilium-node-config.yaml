apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: cilium-node-config
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./kubernetes/infra/cilium/overlays/production/node-config
  prune: true
  dependsOn:
    - name: cilium
  sourceRef:
    kind: GitRepository
    name: flux-system
