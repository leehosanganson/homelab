apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-secrets-external
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: grafana-secrets
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: grafana-user
    - secretKey: admin-password
      remoteRef:
        key: grafana-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-resend-smtp-credentials-external
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: grafana-resend-smtp-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        user: "resend"
        password: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: resend-homelab-api-key
