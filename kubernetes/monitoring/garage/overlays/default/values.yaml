garage:
  # Single-node homelab deployment (no redundancy).
  replicationFactor: "1"
  consistencyMode: "consistent"

  # Use the ExternalSecret-created secret instead of the chart-generated one.
  existingRpcSecret: garage-rpc-credentials

  s3:
    api:
      region: garage
    web:
      rootDomain: ".web.garage.tld"

# Single-node StatefulSet.
deployment:
  kind: StatefulSet
  replicaCount: 1
  podManagementPolicy: OrderedReady

persistence:
  enabled: true
  meta:
    storageClass: "nfs-csi-retain"
    size: 5Gi
  data:
    storageClass: "nfs-csi-retain"
    size: 50Gi

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

# The prometheus chart in this repo uses annotations rather than ServiceMonitor.
monitoring:
  metrics:
    enabled: true
    serviceMonitor:
      enabled: false
