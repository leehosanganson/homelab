apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
spec:
  interval: 1m
  upgrade:
    timeout: 10m
    strategy:
      name: RemediateOnFailure
    remediation:
      strategy: rollback
      retries: 1
      remediateLastFailure: true
  chart:
    spec:
      chart: loki
      version: 18.13.4
      sourceRef:
        kind: HelmRepository
        name: grafana-community
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: loki-values
