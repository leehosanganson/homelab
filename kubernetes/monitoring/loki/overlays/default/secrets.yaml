apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: loki-garage-s3-credentials-external
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: loki-garage-s3-credentials
    creationPolicy: Owner
  data:
    - secretKey: LOKI_S3_ACCESS_KEY_ID
      remoteRef:
        key: loki-garage-s3-access-key
    - secretKey: LOKI_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: loki-garage-s3-secret-key
