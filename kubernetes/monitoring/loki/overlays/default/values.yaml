loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 336h
  ruler:
    enable_api: true
  auth_enabled: false

  # Use the in-cluster Garage S3-compatible object store instead of the
  # deprecated built-in MinIO subchart.
  storage:
    type: s3
    bucketNames:
      chunks: loki
      ruler: loki-ruler
    s3:
      endpoint: http://garage.monitoring.svc.cluster.local:3900
      s3ForcePathStyle: true
      insecure: true
      accessKeyId: $(LOKI_S3_ACCESS_KEY_ID)
      secretAccessKey: $(LOKI_S3_SECRET_ACCESS_KEY)

  extraEnvFrom:
    - secretRef:
        name: loki-garage-s3-credentials

  compactor:
    compaction_interval: 30m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: s3
    retention_period: 336h

# SingleBinary was renamed to Monolithic in chart v18.
deploymentMode: Monolithic

singleBinary:
  replicas: 1

# Zero out replica counts of other deployment modes.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0

# In Monolithic mode the compactor runs inside the single-binary pod; disable the
# standalone distributed component.
compactor:
  enabled: false

indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
