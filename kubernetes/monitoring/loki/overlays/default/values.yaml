loki:
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: azure
        schema: v13
        index:
          prefix: loki_index_
          period: 24h
  pattern_ingester:
    enabled: true
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 336h
  ruler:
    enable_api: true
  auth_enabled: false

  # Migrate from the deprecated built-in MinIO subchart to Azure Blob Storage.
  # The storage account key is injected from the loki-azure-storage-credentials
  # secret via environment variable expansion.
  storage:
    type: azure
    bucketNames:
      chunks: loki
      ruler: loki-ruler
    azure:
      accountName: $(AZURE_STORAGE_ACCOUNT_NAME)

  extraEnvFrom:
    - secretRef:
        name: loki-azure-storage-credentials

  structuredConfig:
    common:
      storage:
        azure:
          account_key: $(AZURE_STORAGE_ACCOUNT_KEY)
    ruler:
      storage:
        azure:
          account_key: $(AZURE_STORAGE_ACCOUNT_KEY)
    storage_config:
      azure:
        account_key: $(AZURE_STORAGE_ACCOUNT_KEY)

  compactor:
    compaction_interval: 30m
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: azure
    retention_period: 336h

# SingleBinary was renamed to Monolithic in chart v18.
deploymentMode: Monolithic

singleBinary:
  replicas: 1

# Zero out replica counts of other deployment modes.
backend:
  replicas: 0
read:
  replicas: 0
write:
  replicas: 0

ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0

# In Monolithic mode the compactor runs inside the single-binary pod; disable the
# standalone distributed component.
compactor:
  enabled: false

indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0
