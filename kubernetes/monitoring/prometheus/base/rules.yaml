apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: homelab-service-alerts
  labels:
    release: kube-prometheus-stack
spec:
  groups:
    - name: homelab.service
      rules:
        - alert: LiteLLMProxyHighFailureRate
          expr: |
            (
              sum(rate(litellm_proxy_failed_requests_metric_total{job="litellm"}[10m]))
              /
              clamp_min(sum(rate(litellm_proxy_total_requests_metric_total{job="litellm"}[10m])), 0.01)
            ) > 0.05
            and
            sum(rate(litellm_proxy_total_requests_metric_total{job="litellm"}[10m])) > 0.05
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: LiteLLM request failures exceed 5%
            description: More than 5% of LiteLLM proxy requests have failed for at least 10 minutes while traffic is present.

        - alert: GPUFramebufferMemoryLow
          expr: max by (hostname, gpu, modelName) (DCGM_FI_DEV_FB_FREE{job="nvidia-dcgm-exporter"}) < 512
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: GPU framebuffer memory is nearly exhausted
            description: NVIDIA GPU {{ $labels.hostname }} GPU {{ $labels.gpu }} has less than 512 MiB of free framebuffer memory for at least 10 minutes.
