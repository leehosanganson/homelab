# kube-prometheus-stack (Prometheus Operator) values.
# Replaces the legacy prometheus-community/prometheus chart.
#
# Grafana stays as the standalone `grafana` chart in this repo; the stack's
# bundled Grafana is disabled. Its Prometheus datasource is repointed to the
# operator-managed Prometheus service (kube-prometheus-stack-prometheus).

grafana:
  enabled: false

prometheus:
  prometheusSpec:
    retention: 90d
    retentionSize: 130GB
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 150Gi
          storageClassName: synology-default
    # Preserves the legacy chart's `extraScrapeConfigs` static target for
    # litellm (service has no Solution selector label for a ServiceMonitor).
    additionalScrapeConfigs:
      - job_name: litellm
        metrics_path: /metrics/
        static_configs:
          - targets:
              - litellm.llm.svc.cluster.local:4000
