apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-resend-smtp-credentials-external
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: alertmanager-resend-smtp-credentials
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        password: "{{ .apiKey }}"
  data:
    - secretKey: apiKey
      remoteRef:
        key: resend-homelab-api-key
