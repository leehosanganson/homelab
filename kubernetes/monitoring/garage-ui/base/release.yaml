apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: garage-ui
spec:
  interval: 1h
  chart:
    spec:
      chart: garage-ui
      version: 0.11.1
      sourceRef:
        kind: HelmRepository
        name: garage-ui
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: garage-ui-values
