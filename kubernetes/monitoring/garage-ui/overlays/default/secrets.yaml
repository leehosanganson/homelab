apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-ui-admin-token-external
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: garage-ui-admin-token
    creationPolicy: Owner
  data:
    - secretKey: admin-token
      remoteRef:
        key: garage-ui-admin-token
