apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: litellm-db
  labels:
    db: litellm-db
spec:
  enablePDB: false # Temporary for kernel maintenance; restore after rollout.
  instances: 1
  resources:
    requests:
      memory: 192Mi
  storage:
    size: 10Gi
  monitoring:
    enablePodMonitor: true
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: litellm-backup-storage
  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: litellm-backup-storage
          serverName: litellm-db-backup
