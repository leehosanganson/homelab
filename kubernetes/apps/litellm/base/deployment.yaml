apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.103.1@sha256:df15400b5b80925c45d3fd53f8f7a6c0eaa8a25a86833e1b358002e129018943
          ports:
            - containerPort: 4000
            - containerPort: 4001
          args:
            - --config
            - /app/config.yaml
            - --prometheus_metrics_port
            - "4001"
          volumeMounts:
            - name: litellm-config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: primary-key
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: salt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: db-url
            - name: STORE_MODEL_IN_DB
              value: "True"
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: litellm-config-volume
          configMap:
            name: litellm-config
