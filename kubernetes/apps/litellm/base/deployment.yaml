apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:v1.104.2@sha256:3d88bd757134a00e8c00237b85a021ab1f6d54abb9c1df750f411dbe7256a500
          ports:
            - containerPort: 4000
            - containerPort: 4001
          args:
            - --config
            - /app/config.yaml
            - --prometheus_metrics_port
            - "4001"
          volumeMounts:
            - name: litellm-config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: primary-key
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: salt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: db-url
            - name: STORE_MODEL_IN_DB
              value: "True"
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
            limits:
              memory: "2Gi"
              cpu: "2000m"
      volumes:
        - name: litellm-config-volume
          configMap:
            name: litellm-config
