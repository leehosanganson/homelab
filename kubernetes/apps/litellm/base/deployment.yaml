apiVersion: apps/v1
kind: Deployment
metadata:
  name: litellm
spec:
  replicas: 1
  selector:
    matchLabels:
      app: litellm
  template:
    metadata:
      labels:
        app: litellm
    spec:
      containers:
        - name: litellm
          image: ghcr.io/berriai/litellm:1.110.2@sha256:ef798594ca3db8d81bad2e1439f536f49b71fe095ee9f20416f5e149b4e22035
          ports:
            - containerPort: 4000
            - containerPort: 4001
          args:
            - --config
            - /app/config.yaml
            - --prometheus_metrics_port
            - "4001"
          volumeMounts:
            - name: litellm-config-volume
              mountPath: /app/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: prometheus-multiproc
              mountPath: /tmp/prometheus-multiproc
            - name: chatgpt-tokens
              mountPath: /tokens/chatgpt
          envFrom:
            - configMapRef:
                name: litellm-env
          env:
            - name: LITELLM_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: primary-key
            - name: LITELLM_SALT_KEY
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: salt
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: litellm-secrets
                  key: db-url
            - name: STORE_MODEL_IN_DB
              value: "True"
          resources:
            requests:
              memory: 1Gi
              cpu: 100m
            limits:
              memory: "1.5Gi"
              cpu: "2000m"
      volumes:
        - name: litellm-config-volume
          configMap:
            name: litellm-config
        - name: prometheus-multiproc
          emptyDir: {}
        - name: chatgpt-tokens
          persistentVolumeClaim:
            claimName: litellm-chatgpt-tokens-pvc
