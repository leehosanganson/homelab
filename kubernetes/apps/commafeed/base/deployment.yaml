apiVersion: apps/v1
kind: Deployment
metadata:
  name: commafeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commafeed
  template:
    metadata:
      labels:
        app: commafeed
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: commafeed
          image: athou/commafeed:7.5.2-postgresql@sha256:bc7cdba5b5769ff49a8430ef5134968f6d8d2cd8aff471d85a7d89150100902a
          ports:
            - containerPort: 8082
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: commafeed-env
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commafeed-env
                  key: password
          envFrom:
            - configMapRef:
                name: commafeed-configmap
          resources:
            limits:
              memory: "512Mi"
      restartPolicy: Always
