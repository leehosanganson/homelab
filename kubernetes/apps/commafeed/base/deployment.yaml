apiVersion: apps/v1
kind: Deployment
metadata:
  name: commafeed
spec:
  replicas: 1
  selector:
    matchLabels:
      app: commafeed
  template:
    metadata:
      labels:
        app: commafeed
    spec:
      securityContext:
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: commafeed
          image: athou/commafeed:7.4.0-postgresql@sha256:1b42134aea1ddec22cb49f11cfa23664e98aad6eaa3ec49f1173de4cf7edbae5
          ports:
            - containerPort: 8082
              protocol: TCP
          securityContext:
            allowPrivilegeEscalation: false
          env:
            - name: QUARKUS_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: commafeed-env
                  key: username
            - name: QUARKUS_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: commafeed-env
                  key: password
          envFrom:
            - configMapRef:
                name: commafeed-configmap
          resources:
            limits:
              memory: "512Mi"
      restartPolicy: Always
