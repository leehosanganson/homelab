apiVersion: v1
kind: Service
metadata:
  name: web
  annotations:
    svccontroller.k3s.cattle.io/tolerations: |
      - key: gpu
        operator: Equal
        value: "true"
        effect: NoSchedule
spec:
  selector:
    app: karakeep-web
  ports:
    - protocol: TCP
      port: 3000
      targetPort: 3000
  type: LoadBalancer