namespace: media

resources:
  - ../../base
  - secrets.yaml

patches:
  - path: patch-velero.yaml
  - path: patch-gpu-placement.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
  - path: patch-arr-node-selector.yaml
    target:
      group: apps
      version: v1
      kind: Deployment
      name: ^(bazarr|lidarr|lrcget|prowlarr|radarr|sonarr)$
