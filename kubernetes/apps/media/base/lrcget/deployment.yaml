apiVersion: apps/v1
kind: Deployment
metadata:
  name: lrcget
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lrcget
  template:
    metadata:
      labels:
        app: lrcget
    spec:
      containers:
        - name: lrcget
          image: gtt1229/docker-lrcget:lrcget-2.2.2@sha256:d145ec76c953e930a08977e8fad9399bb4f618104c5a149d629380ece99dbf7b
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5800
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /music
              subPath: music
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lrcget-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
