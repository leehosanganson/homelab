apiVersion: apps/v1
kind: Deployment
metadata:
  name: lrcget
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: lrcget
  template:
    metadata:
      labels:
        app: lrcget
    spec:
      nodeSelector:
        stack.arr: "arr-1"
      containers:
        - name: lrcget
          image: gtt1229/docker-lrcget:lrcget-2.2.2@sha256:cce109a47bfd551faa5b9e7d4c72bafb0a4cbd69c818d8f3aa5802a80de41df1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5800
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - name: config
              mountPath: /config
            - name: media
              mountPath: /music
              subPath: music
      volumes:
        - name: config
          persistentVolumeClaim:
            claimName: lrcget-pvc
        - name: media
          persistentVolumeClaim:
            claimName: media-pvc
