apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: remote-browser-kasm-password-external
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: remote-browser-kasm-password
    creationPolicy: Owner
  data:
    - secretKey: VNC_PW
      remoteRef:
        key: remote-browser-kasm-password
