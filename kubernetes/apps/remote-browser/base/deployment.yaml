apiVersion: apps/v1
kind: Deployment
metadata:
  name: chrome-runner
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: chrome-runner
  template:
    metadata:
      labels:
        app: chrome-runner
        app.kubernetes.io/name: remote-browser
    spec:
      securityContext:
        fsGroup: 1201
        fsGroupChangePolicy: OnRootMismatch
      runtimeClassName: nvidia
      nodeSelector:
        nvidia.com/gpu.present: "true"
      tolerations:
        - key: gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      containers:
        - name: remote-browser
          image: kasmweb/chrome:1.19.0@sha256:f415301cf454daa6693962246b674a806158cd184ee70742b219133fa8117773
          envFrom:
            - configMapRef:
                name: remote-browser-config
          env:
            - name: VNC_PW
              valueFrom:
                secretKeyRef:
                  name: remote-browser-kasm-password
                  key: VNC_PW
          ports:
            - containerPort: 6901
              name: kasmvnc
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          resources:
            requests:
              cpu: "1"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "4Gi"
          volumeMounts:
            - name: kasm-home
              mountPath: /home/kasm-user
            - name: kasmvnc-config
              mountPath: /etc/kasmvnc/kasmvnc.yaml
              subPath: kasmvnc.yaml
            - name: shm
              mountPath: /dev/shm
            - name: dri
              mountPath: /dev/dri
      volumes:
        - name: kasm-home
          persistentVolumeClaim:
            claimName: kasm-home-pvc
        - name: kasmvnc-config
          configMap:
            name: remote-browser-kasmvnc
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
        - name: dri
          hostPath:
            path: /dev/dri
            type: Directory
