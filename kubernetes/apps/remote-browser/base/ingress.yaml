apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: remote-browser
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-cloudflare
spec:
  ingressClassName: traefik
  rules:
    - host: remote-browser.homelab.leehosanganson.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: remote-browser
                port:
                  number: 6901
  tls:
    - hosts:
        - remote-browser.homelab.leehosanganson.dev
      secretName: remote-browser-tls
