apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpp
spec:
  template:
    spec:
      tolerations:
        - key: gpu
          operator: Equal
          value: "true"
          effect: NoSchedule
      affinity:
        nodeAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              preference:
                matchFields:
                  - key: metadata.name
                    operator: In
                    values:
                      - k3s-gpu-01
