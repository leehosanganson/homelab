apiVersion: v1
kind: ConfigMap
metadata:
  name: chrome-keepalive
data:
  keepalive.py: |
    #!/usr/bin/env python3
    import asyncio
    import json
    import os
    import signal
    import sys

    import websockets

    WS_URL = os.environ.get("SELKIES_WS_URL", "ws://127.0.0.1:8082/websocket")
    DISPLAY_ID = os.environ.get("SELKIES_KEEPALIVE_DISPLAY", "primary")
    WIDTH = int(os.environ.get("SELKIES_KEEPALIVE_WIDTH", "1920"))
    HEIGHT = int(os.environ.get("SELKIES_KEEPALIVE_HEIGHT", "1080"))
    RECONNECT_DELAY = int(os.environ.get("SELKIES_KEEPALIVE_RECONNECT_DELAY", "3"))

    def settings_payload(display_id):
        return (
            "SETTINGS,"
            + json.dumps(
                {
                    "type": "settings",
                    "displayId": display_id,
                    "framerate": 30,
                    "encoder": "h264enc",
                    "is_manual_resolution_mode": False,
                    "scaling_dpi": 96,
                    "initialClientWidth": WIDTH,
                    "initialClientHeight": HEIGHT,
                }
            )
        )

    async def keepalive():
        while True:
            try:
                async with websockets.connect(WS_URL) as ws:
                    try:
                        await asyncio.wait_for(ws.recv(), timeout=10)
                    except asyncio.TimeoutError:
                        pass
                    await ws.send(settings_payload(DISPLAY_ID))
                    print(f"[keepalive] connected display={DISPLAY_ID}", flush=True)
                    async for msg in ws:
                        text = msg if isinstance(msg, str) else str(msg)
                        if text.startswith("KILL "):
                            print(f"[keepalive] superseded by real viewer: {text}", flush=True)
                            break
            except Exception as e:  # noqa: BLE001
                print(f"[keepalive] disconnected ({e}); reconnect in {RECONNECT_DELAY}s", flush=True)
            await asyncio.sleep(RECONNECT_DELAY)

    async def main():
        loop = asyncio.get_running_loop()
        for sig in (signal.SIGTERM, signal.SIGINT):
            loop.add_signal_handler(sig, lambda: sys.exit(0))
        await keepalive()

    if __name__ == "__main__":
        asyncio.run(main())
