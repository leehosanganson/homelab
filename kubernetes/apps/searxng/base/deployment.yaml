apiVersion: apps/v1
kind: Deployment
metadata:
  name: searxng
spec:
  replicas: 1
  selector:
    matchLabels:
      app: searxng
  template:
    metadata:
      labels:
        app: searxng
    spec:
      enableServiceLinks: false
      dnsPolicy: None
      dnsConfig:
        nameservers:
          - 127.0.0.1
        options:
          - name: ndots
            value: "1"
      initContainers:
        - name: setup-config
          image: busybox@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e
          command:
            - "/bin/sh"
            - "-c"
            - "cp /tmp/config/settings.yml /etc/searxng/settings.yml && chown -R 977:977 /etc/searxng"
          securityContext:
            runAsUser: 0
            privileged: true
          volumeMounts:
            - name: searxng-config-readonly
              mountPath: /tmp/config
            - name: searxng-config-dir
              mountPath: /etc/searxng

      containers:
        - name: gluetun
          image: qmcgaw/gluetun:v3.41@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
          securityContext:
            runAsNonRoot: false
            runAsUser: 0
            runAsGroup: 0
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
              add:
                - NET_ADMIN
          volumeMounts:
            - name: tun
              mountPath: /dev/net/tun
          envFrom:
            - configMapRef:
                name: gluetun-config
          env:
            - name: WIREGUARD_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: gluetun-secrets
                  key: WIREGUARD_PRIVATE_KEY
          startupProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 5
            failureThreshold: 60
          livenessProbe:
            exec:
              command:
                - /gluetun-entrypoint
                - healthcheck
            periodSeconds: 10
        - name: searxng
          image: searxng/searxng:latest@sha256:2d8d40c0d69d8b458d394701d284ccb052b25a19c18c930d8920296953caafe2
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: searxng-config
            - secretRef:
                name: searxng-secrets
          securityContext:
            runAsNonRoot: true
            runAsUser: 977
            runAsGroup: 977
            seccompProfile:
              type: RuntimeDefault
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: searxng-config-dir
              mountPath: /etc/searxng/settings.yml
              subPath: settings.yml
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          resources:
            requests:
              memory: 128Mi
              cpu: 50m
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10

      volumes:
        - name: tmp
          emptyDir: {}
        - name: searxng-config-dir
          emptyDir: {}
        - name: searxng-config-readonly
          configMap:
            name: searxng-config
        - name: tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
