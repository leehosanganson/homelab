apiVersion: v1
kind: ConfigMap
metadata:
  name: chrome-runner-launcher
data:
  launcher.conf: |
    [program:granblue-launcher]
    priority=20
    command=/opt/selenium/launch.sh
    directory=/home/seluser
    user=seluser
    autostart=true
    autorestart=true
    startsecs=10
    startretries=999
    stopasgroup=true
    killasgroup=true
    ;Logs
    redirect_stderr=true
    stdout_logfile=/dev/stdout
    stdout_logfile_maxbytes=0
  launch.sh: |
    #!/usr/bin/env bash
    set -e
    export HOME=/home/seluser
    export DISPLAY=:99.0
    PROFILE="$HOME/.config/google-chrome"
    # wait for Xvfb
    for i in $(seq 1 30); do
      xdpyinfo -display "$DISPLAY" >/dev/null 2>&1 && break
      sleep 1
    done
    # clear stale singleton locks from a previous crash (the grid also uses
    # this profile; a leftover lock aborts the next Chrome start)
    rm -f "$PROFILE"/SingletonLock "$PROFILE"/SingletonSocket "$PROFILE"/SingletonCookie
    echo "granblue-launcher: starting Chrome on $DISPLAY" >&2
    exec /opt/google/chrome/chrome \
      --no-sandbox \
      --disable-dev-shm-usage \
      --disable-background-timer-throttling \
      --disable-backgrounding-occluded-windows \
      --disable-renderer-backgrounding \
      --window-size=390,844 \
      --start-maximized \
      --no-first-run \
      --no-default-browser-check \
      --user-data-dir="$PROFILE" \
      https://game.granbluefantasy.jp/
