apiVersion: v1
kind: ConfigMap
metadata:
  name: chrome-runner-vnc
data:
  mandatory.json: |
    {"resize": "scale"}
  defaults.json: |
    {"resize": "scale"}
  start-vnc.sh: |
    #!/usr/bin/env bash
    if [ "${START_XVFB:-$SE_START_XVFB}" = true ]; then
      if [ "${START_VNC:-$SE_START_VNC}" = true ]; then
        VNC_NO_PASSWORD=${VNC_NO_PASSWORD:-$SE_VNC_NO_PASSWORD}
        if [ "${VNC_NO_PASSWORD}" = "true" ] || [ "${VNC_NO_PASSWORD}" = "1" ]; then
          X11VNC_OPTS=
        else
          X11VNC_OPTS=-usepw
        fi
        VNC_PASSWORD=${VNC_PASSWORD:-$SE_VNC_PASSWORD}
        if [ ! -z $VNC_PASSWORD ]; then
          x11vnc -storepasswd ${VNC_PASSWORD} ${HOME}/.vnc/passwd
        fi
        for i in $(seq 1 10); do
          sleep 1
          xdpyinfo -display ${DISPLAY} >/dev/null 2>&1 && break
        done
        exec x11vnc ${X11VNC_OPTS} -forever -shared \
          -wait 5 -defer 5 -sb 0 \
          -rfbport ${VNC_PORT:-$SE_VNC_PORT} \
          -rfbportv6 ${VNC_PORT:-$SE_VNC_PORT} \
          -display ${DISPLAY}
      fi
    fi
