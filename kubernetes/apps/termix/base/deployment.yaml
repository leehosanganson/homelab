apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: termix
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: termix
    spec:
      containers:
        - name: termix
          image: ghcr.io/lukegus/termix:26.11.1@sha256:cac04fdc9cd38c98566e6e903ad77a3a85b62869e6b78ada35e1570cbc32c6cb
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            limits:
              memory: "512Mi"
              cpu: "500m"
          volumeMounts:
            - mountPath: /app/data
              name: termix-pvc
        - name: guacd
          image: guacamole/guacd:latest@sha256:646f0f03bcf5890af1db8f4c95a5d41c686389902cb5fed7f9161352bf51a5b0
          ports:
            - containerPort: 4822
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: termix-pvc
          persistentVolumeClaim:
            claimName: termix-pvc
