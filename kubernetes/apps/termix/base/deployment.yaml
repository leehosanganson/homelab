apiVersion: apps/v1
kind: Deployment
metadata:
  name: termix
spec:
  replicas: 1
  selector:
    matchLabels:
      app: termix
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: termix
    spec:
      containers:
        - name: termix
          image: ghcr.io/lukegus/termix:26.11.2@sha256:9fe1ff21badf4c85be14fa2129122d87690f9012d3e5a341f46d6bd3b7a8d862
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
          resources:
            requests:
              memory: "512Mi"
            limits:
              memory: "896Mi"
              cpu: "500m"
          volumeMounts:
            - mountPath: /app/data
              name: termix-pvc
        - name: guacd
          image: guacamole/guacd:latest@sha256:bc2f853ece26604a5436737a5a6fb602ba59bb83ad747be25fa29a76c81bb1fc
          ports:
            - containerPort: 4822
          resources:
            limits:
              memory: "256Mi"
              cpu: "250m"
      volumes:
        - name: termix-pvc
          persistentVolumeClaim:
            claimName: termix-pvc
