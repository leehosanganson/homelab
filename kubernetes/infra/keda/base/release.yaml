apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: keda
spec:
  interval: 1m
  chart:
    spec:
      chart: keda
      version: 2.20.2
      sourceRef:
        kind: HelmRepository
        name: keda
        namespace: flux-system
  valuesFrom:
    - kind: ConfigMap
      name: keda-values
