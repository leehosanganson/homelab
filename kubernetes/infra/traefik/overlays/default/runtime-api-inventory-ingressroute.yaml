apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: traefik-runtime-api-inventory
  namespace: kube-system
  annotations:
    homelab.leehosanganson.dev/temporary: remove-after-mini-qr-verification
spec:
  ingressClassName: traefik
  entryPoints:
    - traefik
  routes:
    - kind: Rule
      match: Method(`GET`) && Path(`/api/rawdata`)
      priority: 10000
      middlewares:
        - name: traefik-runtime-api-loopback
      services:
        - name: api@internal
          kind: TraefikService
