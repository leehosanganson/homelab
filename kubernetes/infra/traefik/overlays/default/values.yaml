additionalArguments:
  - "--log.level=INFO"
  - "--api.dashboard=true"
deployment:
  replicas: 2
  podAnnotations:
    prometheus.io/port: "8082"
    prometheus.io/scrape: "true"
ports:
  web:
    exposedPort: 80
    transport:
      respondingTimeouts:
        readTimeout: "3600"
        writeTimeout: "3600"
        idleTimeout: "3600"
  websecure:
    exposedPort: 443
    transport:
      respondingTimeouts:
        readTimeout: "3600"
        writeTimeout: "3600"
        idleTimeout: "3600"
podDisruptionBudget:
  enabled: true
  minAvailable: 1
topologySpreadConstraints:
  - labelSelector:
      matchLabels:
        app.kubernetes.io/name: traefik
        app.kubernetes.io/instance: traefik-kube-system
    maxSkew: 1
    topologyKey: kubernetes.io/hostname
    whenUnsatisfiable: DoNotSchedule
service:
  ipFamilyPolicy: PreferDualStack
  spec:
    loadBalancerIP: "192.168.1.250"
certificatesResolvers:
  letsencrypt:
    acme:
      email: leehosanganson@gmail.com
      dnsChallenge:
        provider: cloudflare
        resolvers:
          - "1.1.1.1:53"
          - "8.8.8.8:53"
priorityClassName: system-cluster-critical
providers:
  kubernetesIngress:
    publishedService:
      enabled: true
tolerations:
  - key: CriticalAddonsOnly
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/control-plane
    operator: Exists
  - effect: NoSchedule
    key: node-role.kubernetes.io/master
    operator: Exists

env:
  - name: CF_DNS_API_TOKEN
    valueFrom:
      secretKeyRef:
        name: traefik-cloudflare-api-token
        key: CF_DNS_API_TOKEN
