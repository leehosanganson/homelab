namespace: kube-system

resources:
  - runtime-api-inventory-ingressroute.yaml
  - runtime-api-inventory-middleware.yaml
  - ../../base
  - secrets.yaml

configMapGenerator:
  - files:
      - values.yaml
    name: traefik-values
    options:
      disableNameSuffixHash: true
      labels:
        helm.toolkit.fluxcd.io/watch: "true"
