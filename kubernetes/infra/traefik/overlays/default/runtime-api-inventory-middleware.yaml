apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: traefik-runtime-api-loopback
  namespace: kube-system
  annotations:
    homelab.leehosanganson.dev/temporary: remove-after-mini-qr-verification
spec:
