# Locally-managed Cloudflare Tunnel ingress routes.
# Single source of truth for public-hostname -> service routing (reconciled by Flux).
# Credentials file is provided separately (cloudflare-tunnel-credentials secret).
tunnel: REPLACE_ME_TUNNEL_ID
credentials-file: /etc/cloudflared/creds/credentials.json
metrics: 0.0.0.0:2000
no-autoupdate: true

ingress:
  # root domain
  - hostname: leehosanganson.dev
    service: http://portfolio.utility:80
  - hostname: www.leehosanganson.dev
    service: http://portfolio.utility:80

  # published apps (non-homelab)
  - hostname: commafeed.leehosanganson.dev
    service: http://commafeed.commafeed:8082
  - hostname: grimmory.leehosanganson.dev
    service: http://grimmory.grimmory:6060
  - hostname: it-tools.leehosanganson.dev
    service: http://it-tools.utility:80
  - hostname: karakeep.leehosanganson.dev
    service: http://web.karakeep:3000
  - hostname: litellm.leehosanganson.dev
    service: http://litellm.llm:4000
  - hostname: navidrome.leehosanganson.dev
    service: http://navidrome.navidrome:4533
  - hostname: whoami.leehosanganson.dev
    service: http://whoami.utility:80
  - hostname: zotero.leehosanganson.dev
    service: http://webdav.zotero:80

  # harbor: core API paths -> harbor-core, UI -> harbor-portal
  - hostname: harbor.leehosanganson.dev
    path: ^/(api|c|service|v2)/
    service: http://harbor-core.harbor:80
  - hostname: harbor.leehosanganson.dev
    service: http://harbor-portal.harbor:80

  # life-in-the-uk-quiz: /api -> backend, everything else -> frontend
  - hostname: life-in-the-uk-quiz.leehosanganson.dev
    path: ^/api
    service: http://backend.life-in-the-uk-quiz:8080
  - hostname: life-in-the-uk-quiz.leehosanganson.dev
    service: http://frontend.life-in-the-uk-quiz:80

  # catch-all (required, last rule)
  - service: http_status:404
