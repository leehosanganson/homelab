configuration:
  backupStorageLocation:
    - provider: azure
      bucket: velero
      config:
        resourceGroup: homelab-kubernetes
        storageAccount: lhshomelabbackup
        subscriptionId: 585dcfc1-23d7-4e71-82eb-71027af01852
      default: true
  volumeSnapshotLocation: []
  defaultVolumesToFsBackup: true
  # Run kopia repo maintenance once daily (default would run ~hourly),
  # drastically reducing the continuous Azure storage egress (~6.5GB/day)
  # caused by per-namespace kopia maintain jobs reading index blobs.
  defaultRepoMaintainFrequency: 24h

credentials:
  useSecret: true
  existingSecret: cloud-credentials

initContainers:
  - name: velero-plugin-for-microsoft-azure
    image: velero/velero-plugin-for-microsoft-azure:v1.14.2
    volumeMounts:
      - mountPath: /target
        name: plugins

deployNodeAgent: true

features: EnableCSI
