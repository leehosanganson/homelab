apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-env-external
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: authentik-env
    creationPolicy: Owner
  data:
    - secretKey: AUTHENTIK_SECRET_KEY
      remoteRef:
        key: authentik-secret-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-db-env-external
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: authentik-db-env
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        key: authentik-db-username
    - secretKey: password
      remoteRef:
        key: authentik-db-password
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: authentik-backup-env-external
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: azure-keyvault
    kind: ClusterSecretStore
  target:
    name: authentik-backup-env
    creationPolicy: Owner
  data:
    - secretKey: storage-account-name
      remoteRef:
        key: homelab-backup-storageaccount-name
    - secretKey: blob-sas
      remoteRef:
        key: authentik-blob-sas
