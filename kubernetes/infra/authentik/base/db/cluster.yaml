apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
  labels:
    db: authentik-db
spec:
  enablePDB: false # Temporary for kernel maintenance; restore after rollout.
  instances: 1
  resources:
    requests:
      memory: 192Mi
  storage:
    size: 3Gi
  monitoring:
    enablePodMonitor: true
  bootstrap:
    initdb:
      database: authentik
      owner: authentik
      secret:
        name: authentik-db-env
  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-backup-storage
        serverName: authentik-db-backup
  externalClusters:
    - name: clusterBackup
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: authentik-backup-storage
          serverName: authentik-db-backup
