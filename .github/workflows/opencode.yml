name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  workflow_dispatch:
jobs:
  opencode:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (
        contains(fromJson('["OWNER","MEMBER"]'), github.event.comment.author_association) &&
        (contains(github.event.comment.body, '/opencode') || contains(github.event.comment.body, '/oc'))
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Prepare OpenCode API secrets
        run: |
          mkdir -p ~/.config/sops-nix/secrets
          printf '%s' "$LITELLM_KEY" > ~/.config/sops-nix/secrets/litellm-api-key
          printf '%s' "$OPENCODE_API_KEY" > ~/.config/sops-nix/secrets/opencode-api-key
        env:
          LITELLM_KEY: ${{ secrets.LITELLM_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}

      - name: Run OpenCode
        uses: anomalyco/opencode/github@77fc88c8ade8e5a620ebbe1197f3a572d29ae91a # latest
        env:
          LITELLM_KEY: ${{ secrets.LITELLM_KEY }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_CONFIG: .github/opencode/opencode.json
          OPENCODE_ENABLE_EXA: 1
        with:
          model: "litellm/unsloth/qwen-3.6"
