name: flux-validate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - "fluxcd/clusters/**"
  push:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - "fluxcd/clusters/**"

permissions:
  contents: read

env:
  # Pin versions for reproducible CI. Bump these periodically.
  KUSTOMIZE_VERSION: "5.8.1"
  KUBECONFORM_VERSION: "0.7.0"
  # CRDs that are not yet in the upstream CRDs-catalog are skipped rather than failing.
  KUBECONFORM_SKIP: "CustomResourceDefinition"
  KUBECONFORM_SCHEMA_LOCATION: "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json"

jobs:
  validate:
    name: validate kubernetes manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"

          curl -fsSL "https://github.com/kubernetes-sigs/kustomize/releases/download/kustomize%2Fv${KUSTOMIZE_VERSION}/kustomize_v${KUSTOMIZE_VERSION}_linux_amd64.tar.gz" | \
            tar -xz -C "$HOME/.local/bin" kustomize
          chmod +x "$HOME/.local/bin/kustomize"

          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | \
            tar -xz -C "$HOME/.local/bin" kubeconform
          chmod +x "$HOME/.local/bin/kubeconform"

          kustomize version
          kubeconform -v

      - name: Lint kustomization files
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          find kubernetes fluxcd/clusters -name 'kustomization.yaml' | while read -r f; do
            dir=$(dirname "$f")
            echo "Linting $dir ..."
            restrictor=LoadRestrictionsRootOnly
            # Use the same load restrictor as Flux for the production apps aggregate.
            if [ "$dir" = kubernetes/apps/overlays/production ]; then
              restrictor=LoadRestrictionsNone
            fi
            kustomize build --load-restrictor "$restrictor" "$dir" > /dev/null || exit 1
          done

      - name: Render production overlays
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          mkdir -p /tmp/bundle
          kustomize build --load-restrictor LoadRestrictionsNone kubernetes/apps/overlays/production -o /tmp/bundle/apps-prod.yaml
          kustomize build --load-restrictor LoadRestrictionsRootOnly kubernetes/infra/overlays/production -o /tmp/bundle/infra-prod.yaml
          kustomize build --load-restrictor LoadRestrictionsRootOnly kubernetes/monitoring/overlays/production -o /tmp/bundle/mon-prod.yaml
          kustomize build --load-restrictor LoadRestrictionsRootOnly kubernetes/apps/mini-qr/overlays/default/authentik/callback -o /tmp/bundle/mini-qr-callback.yaml

      - name: Check service-owned Mini QR ForwardAuth composition
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          kustomize build kubernetes/apps/mini-qr/overlays/default -o /tmp/bundle/mini-qr.yaml
          ruby -ryaml - /tmp/bundle/{mini-qr,apps-prod,mini-qr-callback}.yaml <<'RUBY'
          def named(resources, kind, name)
            resources.select { |r| r['kind'] == kind && r.dig('metadata', 'name') == name }
          end

          def require_one(resources, kind, name, namespace, path)
            matches = named(resources, kind, name)
            unless matches.map { |r| r.dig('metadata', 'namespace') } == [namespace]
              abort "#{path}: expected exactly one #{kind} #{namespace}/#{name}"
            end
            matches.first
          end

          callback_path = './kubernetes/apps/mini-qr/overlays/default/authentik/callback'
          ARGV.each do |path|
            resources = YAML.load_stream(File.read(path)).compact
            if path.end_with?('/mini-qr-callback.yaml')
              abort "#{path}: expected only the callback route" unless resources.size == 1
              route = require_one(resources, 'IngressRoute', 'mini-qr-outpost', 'authentik', path)
              expected_match = 'Host(`qr.homelab.leehosanganson.dev`) && PathPrefix(`/outpost.goauthentik.io/`)'
              route_rule = route.dig('spec', 'routes')
              unless route_rule&.size == 1 && route_rule.first['match'] == expected_match &&
                     route_rule.first.dig('services') == [{ 'name' => 'authentik-server', 'port' => 80 }] &&
                     !route_rule.first.key?('middlewares')
                abort "#{path}: callback must route the app host/path to authentik-server:80"
              end
              next
            end

            child = require_one(resources, 'Kustomization', 'mini-qr-authentik-callback', 'flux-system', path)
            spec = child.fetch('spec')
            unless child['apiVersion'] == 'kustomize.toolkit.fluxcd.io/v1' &&
                   spec['path'] == callback_path && spec['prune'] == true && !spec.key?('targetNamespace') &&
                   spec['sourceRef'] == { 'kind' => 'GitRepository', 'name' => 'flux-system' } &&
                   spec['dependsOn'] == [{ 'name' => 'infra-production' }]
              abort "#{path}: incorrect callback child reconciliation settings"
            end
            unless named(resources, 'IngressRoute', 'mini-qr-outpost').empty?
              abort "#{path}: callback route must render only from the child path"
            end
            %w[Deployment Service Ingress].each do |kind|
              require_one(resources, kind, 'mini-qr', 'utility', path)
            end
            require_one(resources, 'Middleware', 'mini-qr-forward-auth', 'utility', path)
            require_one(resources, 'NetworkPolicy', 'mini-qr-ingress', 'utility', path)
            ingress = named(resources, 'Ingress', 'mini-qr').first
            unless ingress.dig('metadata', 'annotations', 'traefik.ingress.kubernetes.io/router.middlewares') ==
                   'utility-mini-qr-forward-auth@kubernetescrd'
              abort "#{path}: Mini QR Ingress must attach its local ForwardAuth middleware"
            end
            puts "#{path}: Mini QR ForwardAuth composition passed"
          end
          RUBY

      - name: Validate rendered manifests with kubeconform
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          # Validate core Kubernetes resources against the default schema, and custom
          # CRDs against the Datree CRDs-catalog. Only CustomResourceDefinition
          # definitions themselves are skipped, because there is no external schema
          # for the CRD kind. All CR instances (HelmRelease, ExternalSecret, Cluster,
          # ObjectStore, ClusterIssuer, ClusterSecretStore, GitRepository,
          # HelmRepository, VolumeSnapshotClass, Middleware, Schedule, Backup, etc.)
          # are validated against schemas from datreeio/CRDs-catalog.
          for f in /tmp/bundle/apps-prod.yaml /tmp/bundle/infra-prod.yaml /tmp/bundle/mon-prod.yaml; do
            echo "Validating $f ..."
            kubeconform -strict -summary \
              -schema-location default \
              -schema-location "$KUBECONFORM_SCHEMA_LOCATION" \
              -ignore-missing-schemas \
              -skip "$KUBECONFORM_SKIP" \
              "$f" || exit 1
          done

          kubeconform -strict -summary \
            -schema-location "$KUBECONFORM_SCHEMA_LOCATION" \
            /tmp/bundle/mini-qr-callback.yaml
