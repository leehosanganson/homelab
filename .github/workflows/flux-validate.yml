name: flux-validate

on:
  pull_request:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - "fluxcd/clusters/**"
  push:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - "fluxcd/clusters/**"

permissions:
  contents: read

jobs:
  lint-kustomize:
    name: lint kustomize manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kustomize
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize "$HOME/.local/bin/kustomize"

      - name: Lint kustomization files
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          # Walk every kustomization.yaml under kubernetes/ and lint it
          find kubernetes -name 'kustomization.yaml' | while read -r f; do
            echo "Linting $f ..."
            kustomize lint "$f" || exit 1
          done

  flux-build:
    name: flux build (render & validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kustomize
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize "$HOME/.local/bin/kustomize"

      - name: Render production overlay
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          # Build the production overlays that Flux references
          kustomize build kubernetes/apps/overlays/production -o /tmp/apps-prod.yaml || true
          kustomize build kubernetes/infra/overlays/production -o /tmp/infra-prod.yaml || true
          kustomize build kubernetes/monitoring/overlays/production -o /tmp/mon-prod.yaml || true

      - name: Install kubeconform
        if: always()
        run: |
          KUBECONFORM_VERSION=$(curl -s https://api.github.com/repos/yannh/kubeconform/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kubeconform

      - name: Validate rendered manifests with kubeconform
        if: always()
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          for f in /tmp/apps-prod.yaml /tmp/infra-prod.yaml /tmp/mon-prod.yaml; do
            if [ -s "$f" ]; then
              echo "Validating $f ..."
              kubeconform -strict "$f" || exit 1
            else
              echo "SKIP: $f is empty or missing (expected when cluster has no apps in that overlay)"
            fi
          done

      - name: Validate fluxcd kustomizations
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          # Lint the Flux Kustomization manifests themselves
          find fluxcd/clusters -name 'kustomization.yaml' | while read -r f; do
            echo "Linting $f ..."
            kustomize lint "$f" || exit 1
          done
