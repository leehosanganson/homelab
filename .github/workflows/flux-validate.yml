name: flux-validate

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - "fluxcd/clusters/**"
  push:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - "fluxcd/clusters/**"

permissions:
  contents: read

jobs:
  lint-kustomize:
    name: lint kustomize manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize "$HOME/.local/bin/kustomize"
          KUBECONFORM_VERSION=$(curl -s https://api.github.com/repos/yannh/kubeconform/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kubeconform

      - name: Validate kustomization files
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          find kubernetes -name 'kustomization.yaml' | while read -r f; do
            dir=$(dirname "$f")
            echo "Validating $dir ..."
            kustomize build --load-restrictor LoadRestrictionsRootOnly "$dir" > /dev/null || exit 1
          done

      - name: Validate fluxcd kustomizations
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          find fluxcd/clusters -name 'kustomization.yaml' | while read -r f; do
            dir=$(dirname "$f")
            echo "Validating $dir ..."
            kustomize build --load-restrictor LoadRestrictionsRootOnly "$dir" > /dev/null || exit 1
          done

  flux-build:
    name: flux build (render & validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kustomize and kubeconform
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize "$HOME/.local/bin/kustomize"
          KUBECONFORM_VERSION=$(curl -s https://api.github.com/repos/yannh/kubeconform/releases/latest | grep -o '"tag_name": *"[^"]*"' | cut -d'"' -f4)
          curl -fsSL "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" | tar -xz -C "$HOME/.local/bin" kubeconform

      - name: Render production overlays
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          kustomize build --load-restrictor LoadRestrictionsRootOnly kubernetes/apps/overlays/production -o /tmp/apps-prod.yaml || true
          kustomize build --load-restrictor LoadRestrictionsRootOnly kubernetes/infra/overlays/production -o /tmp/infra-prod.yaml || true
          kustomize build --load-restrictor LoadRestrictionsRootOnly kubernetes/monitoring/overlays/production -o /tmp/mon-prod.yaml || true

      - name: Validate rendered manifests with kubeconform
        if: always()
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          # Validate core K8s resources against the default schema, and custom
          # CRDs using the Datree CRDs catalog.
          # Only skip CustomResourceDefinition resources themselves, since there
          # is no external schema for the CRD kind. All CR instances (HelmRelease,
          # ExternalSecret, Cluster, ObjectStore, ClusterIssuer, ClusterSecretStore,
          # GitRepository, HelmRepository, VolumeSnapshotClass, Middleware, Schedule,
          # Backup, etc.) are validated against schemas from datreeio/CRDs-catalog.
          KUBECONFORM_SKIP="CustomResourceDefinition"
          for f in /tmp/apps-prod.yaml /tmp/infra-prod.yaml /tmp/mon-prod.yaml; do
            if [ -s "$f" ]; then
              echo "Validating $f ..."
              kubeconform -strict -summary \
                -schema-location default \
                -schema-location "https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json" \
                -ignore-missing-schemas \
                -skip "$KUBECONFORM_SKIP" \
                "$f" || exit 1
            else
              echo "SKIP: $f is empty or missing (expected when cluster has no apps in that overlay)"
            fi
          done
