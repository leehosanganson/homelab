name: flux-validate

on:
  pull_request:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - "fluxcd/clusters/**"
  push:
    branches:
      - main
    paths:
      - "kubernetes/**"
      - "fluxcd/clusters/**"

permissions:
  contents: read

jobs:
  lint-kustomize:
    name: lint kustomize manifests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install kustomize
        run: |
          mkdir -p "$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash
          mv kustomize "$HOME/.local/bin/kustomize"

      - name: Validate kustomization files
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          # Use 'kustomize build --load-restrictor=LoadFilesOnly' to validate
          # kustomization syntax and references without rendering manifests.
          find kubernetes -name 'kustomization.yaml' | while read -r f; do
            dir=$(dirname "$f")
            echo "Validating $dir ..."
            kustomize build --load-restrictor=LoadFilesOnly "$dir" > /dev/null || exit 1
          done

      - name: Validate fluxcd kustomizations
        run: |
          set -e
          export PATH="$HOME/.local/bin:$PATH"
          find fluxcd/clusters -name 'kustomization.yaml' | while read -r f; do
            dir=$(dirname "$f")
            echo "Validating $dir ..."
            kustomize build --load-restrictor=LoadFilesOnly "$dir" > /dev/null || exit 1
          done

  flux-build:
    name: flux build (render & validate)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Setup Flux Schema CLI
        uses: fluxcd/flux-schema/actions/setup@main

      - name: Render production overlays
        run: |
          set -e
          mkdir -p /tmp/bundle
          # Build the production overlays that Flux references
          kustomize build kubernetes/apps/overlays/production > /tmp/bundle/apps.yaml || true
          kustomize build kubernetes/infra/overlays/production > /tmp/bundle/infra.yaml || true
          kustomize build kubernetes/monitoring/overlays/production > /tmp/bundle/mon.yaml || true

      - name: Validate rendered manifests with Flux Schema CLI
        run: |
          set -e
          # Validate all rendered YAML files against the ecosystem catalog.
          # The ecosystem catalog covers hundreds of CNCF project CRDs including:
          #   external-secrets.io, cert-manager.io, postgresql.cnpg.io, velero.io, traefik.io
          # Combined with the built-in default catalog (Kubernetes + Flux CRDs),
          # this provides comprehensive schema coverage.
          for f in /tmp/bundle/*.yaml; do
            if [ -s "$f" ]; then
              echo "Validating $f ..."
              flux schema validate "$f" \
                --schema-location default \
                --schema-location ecosystem \
                --verbose \
                --output=text || exit 1
            else
              echo "SKIP: $f is empty or missing"
            fi
          done
